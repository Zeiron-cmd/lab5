name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create virtual environment
        run: |
          python3 -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install -r requirements.txt
      - name: Run tests
        run: |
          .venv/bin/python -m pytest
